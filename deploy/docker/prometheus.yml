global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: smppbox_exporter
    static_configs: [{targets: ['smppbox-exporter:9877']}]
  - job_name: ksmppd_exporter
    static_configs: [{targets: ['ksmppd-exporter:9878']}]
  - job_name: kannel_exporter
    static_configs: [{targets: ['kannel-exporter:9879']}]
